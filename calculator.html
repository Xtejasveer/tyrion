<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }
        .calculator {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
        }
        input[type="text"] {
            width: 100%;
            height: 50px;
            text-align: right;
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding: 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 22%;
            height: 50px;
            margin: 1%;
            font-size: 1.4rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        .operator {
            background-color: #28a745;
        }
        .operator:hover {
            background-color: #1e7e34;
        }
        .equals {
            background-color: #dc3545;
        }
        .equals:hover {
            background-color: #a71d2a;
        }
        .clear {
            background-color: #6c757d;
        }
        .clear:hover {
            background-color: #5a6268;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
        }
        .button-grid button.equals {
            grid-column: span 4;
            background-color: #dc3545;
            font-size: 1.6rem;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" disabled>
        <div class="button-grid">
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('/')">&#247;</button>
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="appendOperator('*')">&times;</button>
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="appendOperator('-')">&minus;</button>
            <button onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendOperator('+')">&#43;</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendNumber(number) {
            display.value += number;
        }

        function appendOperator(operator) {
            if (display.value === '' && operator !== '-') {  // prevent operator at start except minus
                return;
            }
            const lastChar = display.value.slice(-1);
            if ('+-*/'.includes(lastChar)) {  // replace last operator if exists
                display.value = display.value.slice(0, -1) + operator;
            } else {
                display.value += operator;
            }
        }

        function clearDisplay() {
            display.value = '';
        }

        function calculate() {
            try {
                // Use eval safely, assuming controlled input from buttons only
                const result = eval(display.value);
                display.value = result;
            } catch (e) {
                display.value = 'Error';
            }
        }
    </script>
</body>
</html>
